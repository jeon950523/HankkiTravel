# Instructor-managed reference only. This file is intentionally not a Kustomize resource.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hankki-travel-api
  namespace: hankki
spec:
  rules:
    - host: api.hankki.re.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hankki-travel-api
                port:
                  number: 8300

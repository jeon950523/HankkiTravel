# Copy this file outside the repository, replace placeholders, and create the Secret in namespace hankki.
# Do not add the completed Secret to Git or to kustomization resources.
apiVersion: v1
kind: Secret
metadata:
  name: hankki-travel-api-secrets
  namespace: hankki
type: Opaque
stringData:
  DB_HOST: REPLACE_ME
  DB_PORT: REPLACE_ME
  DB_NAME: hankki_planb
  DB_USERNAME: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
  DATA_GO_KR_SERVICE_KEY: REPLACE_ME
  KAKAO_REST_API_KEY: REPLACE_ME
  ADMIN_SYNC_USERNAME: REPLACE_ME_OPTIONAL
  ADMIN_SYNC_PASSWORD: REPLACE_ME_OPTIONAL

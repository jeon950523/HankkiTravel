server:
  port: 8300
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: hankki-travel
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hankki_planb}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
hankki:
  web-base-url: ${WEB_BASE_URL:http://localhost:5175}
  tourism-sync:
    page-size: ${TOUR_API_PAGE_SIZE:100}
    max-pages: ${TOUR_API_MAX_PAGES:1000}
    suspicious-snapshot-retain-ratio: ${TOUR_SYNC_SUSPICIOUS_RATIO:0.5}
    admin:
      enabled: ${ADMIN_SYNC_ENABLED:false}
      username: ${ADMIN_SYNC_USERNAME:}
      password: ${ADMIN_SYNC_PASSWORD:}
      daily-call-budget: ${TOURISM_SYNC_DAILY_CALL_BUDGET:0}
      operation-zone: ${TOURISM_SYNC_OPERATION_ZONE:Asia/Seoul}
  tourism-live:
    max-page-size: ${TOURISM_LIVE_MAX_PAGE_SIZE:30}
  recommendation:
    demand-reference-period: ${DEMAND_REFERENCE_PERIOD:202509}
    list-page-size: ${RECOMMENDATION_LIST_PAGE_SIZE:16}
    prefilter-limit: ${RECOMMENDATION_PREFILTER_LIMIT:10}
    detail-limit: ${RECOMMENDATION_DETAIL_LIMIT:6}
    transit-limit: ${RECOMMENDATION_TRANSIT_LIMIT:3}
    contact-match:
      max-distance-meters: ${CONTACT_MATCH_MAX_DISTANCE_METERS:120}
  planner:
    list-size: ${PLANNER_LIST_SIZE:15}
    detail-limit: ${PLANNER_DETAIL_LIMIT:6}
  integrations:
    tour-api-base-url: https://apis.data.go.kr/B551011/KorService2
    demand-strength-base-url: https://apis.data.go.kr/B551011/AreaTarDemDsService
    resource-demand-base-url: https://apis.data.go.kr/B551011/AreaTarResDemService
    kakao-base-url: https://dapi.kakao.com
    connect-timeout: 3s
    request-timeout: 8s
logging:
  level:
    org.springframework.web: INFO
    java.net.http: OFF

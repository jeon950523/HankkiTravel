apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hankki-travel-api
  labels:
    app.kubernetes.io/name: hankki-travel-api
    app.kubernetes.io/part-of: hankki-travel
spec:
  rules:
    - host: api.hankki.kro.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hankki-travel-api
                port:
                  name: http
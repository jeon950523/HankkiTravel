# Copy this file outside the repository, replace every value, and create the Secret in the hankki namespace.
# Do not add the resulting file to Git or to the Kustomize resources list.
apiVersion: v1
kind: Secret
metadata:
  name: hankki-travel-api-secrets
  namespace: hankki
type: Opaque
stringData:
  DB_HOST: REPLACE_ME
  DB_PORT: REPLACE_ME
  DB_NAME: REPLACE_ME
  DB_USERNAME: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
  DATA_GO_KR_SERVICE_KEY: REPLACE_ME
  KAKAO_REST_API_KEY: REPLACE_ME
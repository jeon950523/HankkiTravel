apiVersion: apps/v1
kind: Deployment
metadata:
  name: hankki-travel-api
  labels:
    app.kubernetes.io/name: hankki-travel-api
    app.kubernetes.io/part-of: hankki-travel
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hankki-travel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hankki-travel-api
        app.kubernetes.io/part-of: hankki-travel
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/jeon950523/hankki_travel_back:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8300
          envFrom:
            - configMapRef:
                name: hankki-travel-api-config
            - secretRef:
                name: hankki-travel-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
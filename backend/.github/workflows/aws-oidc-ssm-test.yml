name: AWS OIDC SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-ssm-test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::435863273085:role/hankki-github-aws-deploy-role
          aws-region: ap-northeast-2
          role-session-name: hankki-oidc-ssm-test
          allowed-account-ids: "435863273085"

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Verify SSM connectivity
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0214e10a447da7fb7"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Hankki GitHub OIDC SSM connectivity test" \
            --parameters 'commands=["echo GITHUB_OIDC_SSM_OK","whoami","hostname"]' \
            --query 'Command.CommandId' \
            --output text)"

          echo "CommandId=$COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
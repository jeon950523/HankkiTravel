name: Backend CI and GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - 'docs/deployment/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application and database migrations
        env:
          MAVEN_OPTS: -Xmx1g
        run: ./mvnw -B -ntp -DargLine="-Xmx3g -Dspring.test.context.cache.maxSize=1" -DreuseForks=false clean verify

  publish-image:
    name: Publish verified image to GHCR
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops-image:
    name: Record the verified image tag
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out GitOps manifests
        uses: actions/checkout@v7
        with:
          repository: jeon950523/k8s-manifests-hankki
          ref: main
          token: ${{ secrets.K8S_MANIFESTS_TOKEN }}
      - name: Update the deployment image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          manifest=backend/deployment.yaml
          image_pattern='^[[:space:]]*image:[[:space:]]*ghcr\.io/jeon950523/hankki_travel_back:[^[:space:]]+[[:space:]]*$'
          if [ "$(grep -Ec "$image_pattern" "$manifest")" != "1" ]; then
            echo "Expected exactly one backend image in ${manifest}."
            exit 1
          fi
          sed -E -i "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/jeon950523/hankki_travel_back:[^[:space:]]+[[:space:]]*$|\1ghcr.io/jeon950523/hankki_travel_back:${IMAGE_TAG}|" "$manifest"
          if git diff --quiet -- "$manifest"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "chore: backend image ${IMAGE_TAG} 배포"
          git push origin HEAD:main

name: Backend CI and GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/deployment/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify application and database migrations
        env:
          MAVEN_OPTS: -Xmx1g
        run: >
          ./mvnw -B -ntp
          -DargLine="-Xmx3g -Dspring.test.context.cache.maxSize=1"
          -DreuseForks=false
          clean verify

  publish-image:
    name: Publish verified image to GHCR
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops-image:
    name: Record the verified image tag
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out GitOps manifests
        uses: actions/checkout@v7
        with:
          repository: jeon950523/k8s-manifests-hankki
          ref: main
          token: ${{ secrets.K8S_MANIFESTS_TOKEN }}

      - name: Update the deployment image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          manifest=backend/deployment.yaml
          image_pattern='^[[:space:]]*image:[[:space:]]*ghcr\.io/jeon950523/hankki_travel_back:[^[:space:]]+[[:space:]]*$'

          if [ "$(grep -Ec "$image_pattern" "$manifest")" != "1" ]; then
            echo "Expected exactly one backend image in ${manifest}."
            exit 1
          fi

          sed -E -i \
            "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/jeon950523/hankki_travel_back:[^[:space:]]+[[:space:]]*$|\1ghcr.io/jeon950523/hankki_travel_back:${IMAGE_TAG}|" \
            "$manifest"

          if git diff --quiet -- "$manifest"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$manifest"
          git commit -m "chore: backend image ${IMAGE_TAG} 배포"
          git push origin HEAD:main

  deploy-aws:
    name: Deploy verified image to AWS
    needs: publish-image
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::435863273085:role/hankki-github-aws-deploy-role
          aws-region: ap-northeast-2
          role-session-name: hankki-backend-deploy
          allowed-account-ids: "435863273085"

      - name: Deploy backend via SSM
        shell: bash
        env:
          INSTANCE_ID: i-0214e10a447da7fb7
          NEW_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          DEPLOY_SCRIPT="$(cat <<'SCRIPT'
          set -Eeuo pipefail

          cd /opt/hankki

          ENV_FILE="/opt/hankki/.env"
          COMPOSE_FILE="/opt/hankki/compose.yaml"
          NEW_IMAGE="__NEW_IMAGE__"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE"
            exit 1
          fi

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Missing $COMPOSE_FILE"
            exit 1
          fi

          OLD_IMAGE="$(grep -m1 '^BACKEND_IMAGE=' "$ENV_FILE" | cut -d= -f2-)"

          if [ -z "$OLD_IMAGE" ]; then
            echo "BACKEND_IMAGE is missing from .env"
            exit 1
          fi

          echo "Current image: $OLD_IMAGE"
          echo "Target image:  $NEW_IMAGE"

          if [ "$OLD_IMAGE" = "$NEW_IMAGE" ]; then
            echo "Target image is already deployed."
            exit 0
          fi

          docker pull "$NEW_IMAGE"

          cp -p "$ENV_FILE" "${ENV_FILE}.predeploy"

          sed -i \
            "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${NEW_IMAGE}|" \
            "$ENV_FILE"

          chmod 600 "$ENV_FILE"

          if ! docker compose -f "$COMPOSE_FILE" config --quiet; then
            echo "Compose validation failed."
            cp -p "${ENV_FILE}.predeploy" "$ENV_FILE"
            rm -f "${ENV_FILE}.predeploy"
            exit 1
          fi

          if ! docker compose -f "$COMPOSE_FILE" up -d --no-deps backend; then
            echo "Backend container replacement failed."
            cp -p "${ENV_FILE}.predeploy" "$ENV_FILE"
            docker compose -f "$COMPOSE_FILE" up -d --no-deps backend || true
            rm -f "${ENV_FILE}.predeploy"
            exit 1
          fi

          HEALTHY=false

          for attempt in $(seq 1 45); do
            if curl -fsS \
              http://127.0.0.1:8300/actuator/health \
              | grep -q '"status":"UP"'; then
              HEALTHY=true
              break
            fi

            echo "Waiting for backend health... ${attempt}/45"
            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "New backend failed health check."
            docker compose -f "$COMPOSE_FILE" logs --tail=120 backend || true

            echo "Rolling back to $OLD_IMAGE"

            cp -p "${ENV_FILE}.predeploy" "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            docker compose -f "$COMPOSE_FILE" up -d --no-deps backend || true

            ROLLBACK_HEALTHY=false

            for attempt in $(seq 1 45); do
              if curl -fsS \
                http://127.0.0.1:8300/actuator/health \
                | grep -q '"status":"UP"'; then
                ROLLBACK_HEALTHY=true
                break
              fi

              sleep 2
            done

            rm -f "${ENV_FILE}.predeploy"

            if [ "$ROLLBACK_HEALTHY" = "true" ]; then
              echo "Rollback succeeded."
            else
              echo "Rollback completed but health check is still failing."
            fi

            exit 1
          fi

          rm -f "${ENV_FILE}.predeploy"

          echo "Deployment succeeded."
          docker compose -f "$COMPOSE_FILE" ps backend
          curl -fsS http://127.0.0.1:8300/actuator/health
          echo
          SCRIPT
          )"

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT/__NEW_IMAGE__/$NEW_IMAGE}"

          SCRIPT_B64="$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w0)"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hankki backend $NEW_IMAGE" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d | bash\"]" \
            --query 'Command.CommandId' \
            --output text)"

          echo "CommandId=$COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)"

            case "$STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 2
          done

          echo "SSM Status=$STATUS"

          echo "----- SSM STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "----- SSM STDERR -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
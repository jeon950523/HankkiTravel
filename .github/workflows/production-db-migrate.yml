name: Production DB Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter MIGRATE_PRODUCTION to run Flyway against the production database.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migration
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm production migration
    runs-on: ubuntu-latest
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMATION" != "MIGRATE_PRODUCTION" ]; then
            echo "The confirmation value must be MIGRATE_PRODUCTION."
            exit 1
          fi

  migrate:
    name: Run Flyway migration
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      FLYWAY_URL: jdbc:mysql://${{ secrets.PROD_DB_HOST }}:${{ secrets.PROD_DB_PORT }}/${{ secrets.PROD_DB_NAME }}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
      FLYWAY_USER: ${{ secrets.PROD_DB_USERNAME }}
      FLYWAY_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check required database secrets
        run: |
          for name in FLYWAY_URL FLYWAY_USER FLYWAY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required production database secret is missing."
              exit 1
            fi
          done
      - name: Apply pending migrations
        run: ./mvnw -B -ntp flyway:migrate
      - name: Verify applied migrations
        run: ./mvnw -B -ntp flyway:validate flyway:info
